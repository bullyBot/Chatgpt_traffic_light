<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT 任务红绿灯</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><h1>任务红绿灯</h1><p>ChatGPT · 专注你的下一件事</p></div><button id="refresh" class="icon-button" title="重新检查页面" aria-label="重新检查页面">↻</button></header>
  <main>
    <section class="overview" aria-live="polite"><div id="signal" class="signal unknown" aria-hidden="true"><span></span><span></span><span></span></div><div><p class="eyebrow">当前状态</p><h2 id="summary">正在连接…</h2><p id="summary-detail">读取已打开的任务页面</p></div></section>
    <div class="section-heading"><h3>正在关注</h3><span id="count">0 个页面</span></div>
    <div id="tasks"></div>
    <section id="empty" hidden><div class="empty-symbol" aria-hidden="true">◎</div><h3>让任务自己来找你</h3><p>打开 ChatGPT 任务页面即可开始。<br>首次安装后，请刷新已打开的页面。</p><button id="open-chat" class="primary">打开 ChatGPT <span aria-hidden="true">↗</span></button></section>
    <p id="error" class="error" role="status" hidden></p>
    <label class="notification-setting"><span><strong>桌面通知</strong><small>需要你处理 · 确认完成</small></span><input id="notifications" type="checkbox" role="switch" aria-label="桌面通知"><span class="switch" aria-hidden="true"></span></label>
    <details><summary>灯色说明与监测范围</summary><div class="legend"><p>🔴 正在进行　🟡 需要你处理</p><p>🟢 完成或空闲　⚪ 未知或异常</p><p>仅监测已打开的页面。绿色完成通知需要先观察到执行，再确认结束标记。普通回复中的提问可能无法识别；关闭或休眠的页面无法保证实时更新。</p></div></details>
  </main>
  <footer><span class="privacy-dot"></span>状态保存在本机 <span>v0.1</span></footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
